<main>
<section class="hero">
  <div class="hero-frame">
    <div class="kicker">OFFICIAL PLAYER GUIDE</div>
    <h1>怪物核心圖鑑</h1>
    <p>搜尋怪物、核心能力或出沒地圖。官方只公開資料，不限制配裝方向；玩家可依自己的玩法自由探索。</p>
    <div class="update" id="updated">載入資料中…</div>
  </div>
</section>

<section class="stats">
  <div class="stat"><div class="n" id="totalStat">0</div><div class="l">怪物核心</div></div>
  <div class="stat"><div class="n" id="normalStat">0</div><div class="l">一般怪</div></div>
  <div class="stat"><div class="n" id="eliteStat">0</div><div class="l">菁英怪</div></div>
  <div class="stat"><div class="n" id="bossStat">0</div><div class="l">王怪</div></div>
</section>

<section class="controls">
  <input class="search" id="q" placeholder="搜尋怪物、核心、能力或出沒地圖…"/>
  <select id="rank"><option value="">全部怪物階級</option></select>
  <select id="type"><option value="">全部核心類別</option></select>
  <select id="ability"><option value="">全部能力</option></select>
  <select id="region"><option value="">全部區域</option></select>
  <button class="reset" id="reset">清除篩選</button>
</section>

<div class="meta-row">
  <div><span id="count">0</span> 筆符合條件</div>
  <div class="legend">
    <b style="color:#ef5c4f">● 猛攻</b>
    <b style="color:#e0b454">● 守護</b>
    <b style="color:#4da0ff">● 精準</b>
    <b style="color:#a46cff">● 疾影</b>
    <b style="color:#47c77a">● 鬥魂</b>
  </div>
</div>

<section id="grid" class="grid"></section>
