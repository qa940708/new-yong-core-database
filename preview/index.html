<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="NEW YONG 怪物核心圖鑑：查詢怪物掉落核心、能力值、出沒地圖與掉落率。"/>
<title>NEW YONG｜怪物核心圖鑑</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="assets/styles.css?v=5"/>
</head>
<body>
<header>
  <div class="top-line"></div>
  <div class="header-inner">
    <div class="brand">
      <img class="brand-logo" alt="YONG 經典校園" src="assets/yong-logo-web.png?v=1"/>
      <div class="brand-copy">
        <strong>怪物核心圖鑑</strong>
        <span>NEW YONG CLASSIC EP9 · CORE DATABASE</span>
      </div>
    </div>
    <div class="header-note">核心顏色僅代表分類，不代表強弱</div>
  </div>
</header>

<main>
<section class="hero">
  <div class="hero-frame">
    <div class="kicker">OFFICIAL PLAYER GUIDE</div>
    <h1>怪物核心圖鑑</h1>
    <p>搜尋怪物、核心能力或出沒地圖。官方只公開資料，不限制配裝方向；玩家可依自己的玩法自由探索。</p>
    <div class="update" id="updated">載入資料中…</div>
  </div>
</section>

<section class="stats">
  <div class="stat"><div class="n" id="totalStat">0</div><div class="l">怪物核心</div></div>
  <div class="stat"><div class="n" id="normalStat">0</div><div class="l">一般怪</div></div>
  <div class="stat"><div class="n" id="eliteStat">0</div><div class="l">菁英怪</div></div>
  <div class="stat"><div class="n" id="bossStat">0</div><div class="l">王怪</div></div>
</section>

<section class="filter-panel">
  <div class="filter-title-row">
    <div>
      <div class="filter-kicker">CORE FILTER</div>
      <h2>核心分類</h2>
    </div>
    <div class="filter-hint">點擊分類可快速篩選</div>
  </div>

  <div class="type-buttons" id="typeButtons">
    <button type="button" class="type-btn active" data-type="">全部</button>
    <button type="button" class="type-btn attack" data-type="猛攻">猛攻</button>
    <button type="button" class="type-btn guard" data-type="守護">守護</button>
    <button type="button" class="type-btn accuracy" data-type="精準">精準</button>
    <button type="button" class="type-btn shadow" data-type="疾影">疾影</button>
    <button type="button" class="type-btn spirit" data-type="鬥魂">鬥魂</button>
  </div>

  <section class="controls">
    <input class="search" id="q" placeholder="搜尋怪物、核心、能力或出沒地圖…"/>
    <select id="rank"><option value="">全部怪物階級</option></select>
    <select id="ability"><option value="">全部能力</option></select>
    <select id="region"><option value="">全部區域</option></select>
    <button class="reset" id="reset">清除篩選</button>
    <select id="type" class="type-select-hidden" aria-hidden="true" tabindex="-1"><option value="">全部核心類別</option></select>
  </section>
</section>

<div class="meta-row">
  <div><span id="count">0</span> 筆符合條件</div>
  <div class="legend">
    <b style="color:#ef5c4f">● 猛攻</b>
    <b style="color:#e0b454">● 守護</b>
    <b style="color:#4da0ff">● 精準</b>
    <b style="color:#a46cff">● 疾影</b>
    <b style="color:#47c77a">● 鬥魂</b>
  </div>
</div>

<section id="grid" class="grid"></section>
<div class="site-footer">NEW YONG CLASSIC EP9｜怪物核心公開資料庫<br>顏色僅代表核心類別，不代表核心強弱。</div>
</main>

<script src="assets/app.js?v=5"></script>
</body>
</html>
