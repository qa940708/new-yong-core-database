name: Back up whole repository to Google Drive

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Import verified ougi gameplay clips into preview
      - Publish completed travel and collection guides
    types: [completed]

permissions:
  contents: read

# No concurrency group: every push must be allowed to finish its own archive.
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check Drive configuration
        env:
          DRIVE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          DRIVE_FOLDER: ${{ vars.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          if [[ -z "$DRIVE_CONFIG" || -z "$DRIVE_FOLDER" ]]; then
            echo "::error::Backup is not activated. Run .github/backup/setup.ps1 to authorize Google Drive and configure this repository."
            exit 1
          fi
      - name: Check out backup tools from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/backup
      - name: Install verified rclone
        shell: bash
        run: |
          set -euo pipefail
          release="rclone-v1.75.2-linux-amd64"
          archive="$RUNNER_TEMP/$release.zip"
          curl --fail --location --retry 3 \
            "https://github.com/rclone/rclone/releases/download/v1.75.2/$release.zip" \
            --output "$archive"
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$release" >> "$GITHUB_PATH"
          git lfs version
          node --version
      - name: Archive, upload and verify the complete repository
        env:
          BACKUP_GITHUB_TOKEN: ${{ github.token }}
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: node .github/backup/backup.mjs
